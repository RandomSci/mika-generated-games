<!doctype html>
<html>
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>Star Patrol</title>
<style>
  :root {
    --night: #0f1d3a;
    --dusk:  #2a4a86;
    --glass: #9cc2ff;
    --lamp:  #ffb55e;
    --paint: #ff6f9c;
    --mint:  #5fe3c8;
    --paper: #f4ead8;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(var(--night), #1b2f5c);
    font-family: "Nunito", "Quicksand", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--paper);
  }
</style>
<script src="../../libs/phaser/3.90.0/phaser.min.js"></script>
</head>
<body>
<script>
// ===== SETTINGS =====
const SETTINGS = {
  title: "Star Patrol",
  player: "../../assets/sprites/ship.svg",   
  playerHeight: 120,
  enemies: [
    { key: "rock1", url: "../../assets/sprites/asteroid-1.svg", size: 110, hp: 2, points: 10 },
    { key: "rock2", url: "../../assets/sprites/asteroid-2.svg", size: 90, hp: 1, points: 10 },
    { key: "ufo", url: "../../assets/sprites/ufo.svg", size: 130, hp: 3, points: 30 },
  ],
  lives: 3,
  fireEvery: 0.16,
  spawnEvery: 0.75,
  skill: 0.9,
};

class Play extends Phaser.Scene {
  constructor() { super("play"); }

  preload() {
    const svg = (key, url, w, h) => this.load.svg(key, url, { width: w, height: h });
    svg("space", "../../assets/backgrounds/space-nebula.svg", 1920, 1080);
    svg("laser", "../../assets/sprites/laser.svg", 20, 44);
    svg("heart", "../../assets/sprites/heart.svg", 56, 54);
    svg("coin", "../../assets/sprites/star-coin.svg", 64, 64);
    svg("glow", "../../assets/particles/glow.svg", 64, 64);
    svg("spark", "../../assets/particles/spark.svg", 32, 32);
    for (const e of SETTINGS.enemies) svg(e.key, e.url, e.size, e.size);
    if (SETTINGS.player.endsWith(".svg")) svg("player", SETTINGS.player, 120, 132);
    else this.load.image("player", SETTINGS.player);
  }

  create() {
    this.bg = [0, -1080].map((y) => this.add.image(0, y, "space").setOrigin(0, 0));
    this.add.particles(0, 0, "glow", {
      x: { min: 0, max: 1920 }, y: -20, speedY: { min: 300, max: 900 },
      scale: { min: 0.04, max: 0.12 }, alpha: { min: 0.4, max: 1 }, lifespan: 2500,
      frequency: 40, blendMode: "ADD",
    });

    this.player = this.add.image(960, 900, "player").setDepth(5);
    this.player.setScale(SETTINGS.playerHeight / this.player.height);
    this.add.particles(0, 0, "glow", {
      follow: this.player, followOffset: { y: 60 }, speedY: { min: 200, max: 400 },
      scale: { start: 0.5, end: 0 }, alpha: { start: 0.8, end: 0 }, lifespan: 300,
      tint: [0xffb55e, 0xff6f9c], blendMode: "ADD", frequency: 20,
    }).setDepth(4);
    
    this.explosion = this.add.particles(0, 0, "spark", {
      speed: { min: 120, max: 620 }, lifespan: 800, scale: { start: 1.3, end: 0 },
      tint: [0xffb55e, 0xff6f9c, 0x9cc2ff, 0xffffff], blendMode: "ADD", emitting: false,
    }).setDepth(8);

    this.shots = [];
    this.enemies = [];
    this.score = 0;
    this.lives = SETTINGS.lives;
    this.wave = 1;
    this.fireTimer = 0;
    this.spawnTimer = 1.2;
    this.invincible = 0;
    this.targetX = 960;

    const font = "Nunito, Quicksand, 'Segoe UI', system-ui, sans-serif";
    this.scoreText = this.add.text(60, 40, "0", {
      fontFamily: font, fontSize: "72px", fontStyle: "900", color: "#f4ead8",
    }).setDepth(10);
    
    this.waveText = this.add.text(1860, 52, "wave 1", {
      fontFamily: font, fontSize: "40px", color: "#9cc2ff",
    }).setOrigin(1, 0).setDepth(10);
    this.hearts = [];
    this.drawLives();

    const title = this.add.text(960, 440, SETTINGS.title, {
      fontFamily: font, fontSize: "130px", fontStyle: "900", color: "#ffb55e",
    }).setOrigin(0.5).setDepth(10);
    this.tweens.add({ targets: title, alpha: 0, y: 380, delay: 1600, duration: 900 });
  }

  drawLives() {
    this.hearts.forEach((h) => h.destroy());
    this.hearts = [];
    for (let i = 0; i < this.lives; i++) {
      this.hearts.push(this.add.image(80 + i * 64, 160, "heart").setDepth(10));
    }
  }

  spawnEnemy() {
    const type = Phaser.Utils.Array.GetRandom(SETTINGS.enemies);
    const sprite = this.add.image(Phaser.Math.Between(120, 1800), -80, type.key).setDepth(3);
    this.enemies.push({
      sprite, hp: type.hp, points: type.points, r: type.size * 0.42,
      vx: Phaser.Math.Between(-80, 80), vy: Phaser.Math.Between(180, 300) + this.wave * 20,
    });
  }

  autopilot() {
    const px = this.player.x;
    const danger = this.enemies.find((e) =>
      e.sprite.y > 560 && e.sprite.y < 880 && Math.abs(e.sprite.x - px) < e.r + 70);
    
    if (danger && Math.random() < SETTINGS.skill) {
      this.targetX = danger.sprite.x > px ? px - 260 : px + 260;
    } else {
      const prey = this.enemies.filter((e) => e.sprite.y > 0 && e.sprite.y < 700)
        .sort((a, b) => b.sprite.y - a.sprite.y)[0];
      if (prey) this.targetX = prey.sprite.x;
    }
    this.targetX = Phaser.Math.Clamp(this.targetX, 100, 1820);
  }

  hit(enemy) {
    this.explosion.emitParticleAt(enemy.sprite.x, enemy.sprite.y, 26);
    this.score += enemy.points;
    this.scoreText.setText(String(this.score));
    enemy.sprite.destroy(); enemy.dead = true;
    if (this.score >= this.wave * 200) this.waveText.setText("wave " + ++this.wave);
  }

  playerHit() {
    this.lives -= 1; this.drawLives();
    if (this.lives <= 0) this.time.delayedCall(900, () => this.scene.restart());
  }

  update(_, deltaMs) {
    const dt = Math.min(deltaMs / 1000, 0.05);
    this.bg.forEach((img) => { 
      img.y += 40 * dt; 
      if (img.y >= 1080) img.y -= 2160; 
    });

    this.autopilot();
    this.player.x += (this.targetX - this.player.x) * Math.min(1, 6 * dt);

    this.fireTimer -= dt;
    if (this.fireTimer <= 0) {
      this.fireTimer = SETTINGS.fireEvery;
      this.shots.push(this.add.image(this.player.x, this.player.y - 70, "laser").setDepth(4));
    }

    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawnEnemy();
      this.spawnTimer = Math.max(0.25, SETTINGS.spawnEvery - this.wave * 0.05);
    }

    for (const shot of this.shots) { shot.y -= 1400 * dt; }
    for (const e of this.enemies) {
      e.sprite.y += e.vy * dt;
      if (!e.dead && Phaser.Math.Distance.Between(e.sprite.x, e.sprite.y, this.player.x, this.player.y) < e.r + 40) {
        this.hit(e); this.playerHit();
      }
    }

    this.shots = this.shots.filter((s) => s.y > -60);
    this.enemies = this.enemies.filter((e) => e.sprite.y <= 1200);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: 1920,
  height: 1080,
  backgroundColor: "#070d22",
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Play,
});
</script>
</body>
</html>
