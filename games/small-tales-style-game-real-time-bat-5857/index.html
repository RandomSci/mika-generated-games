<script>
// ===== SETTINGS =====
const SETTINGS = {
  title: "Tales of Adventure",
  players: [
    { name: "Hero", image: "../../assets/generated/art-1790961204-7f21a0.png", color: 0xffb55e, speed: 430 }, // Player character
    { name: "Mika", image: "../../assets/characters/mika-head.png", color: 0xffb55e, speed: 410 },
    { name: "Luna", image: "../../assets/characters/luna-head.png", color: 0x9cc2ff, speed: 410 },
  ],
  playerSize: 120, // on-screen height of each player
  enemies: 4,      // slimes as enemies
  enemySpeed: 220,
  roundSeconds: 30, // a new round starts after this
  background: "../../assets/backgrounds/night-sky.svg",
};

// The Stage plays the game by itself; the published page is played by a person.
const PLAYER = window.GAME_MODE === "player";

const W = 1920, H = 1080, FONT = "Nunito, Quicksand, 'Segoe UI', system-ui, sans-serif";

class Play extends Phaser.Scene {
  constructor() { super("play"); }

  preload() {
    const svg = (key, url, w, h) => this.load.svg(key, url, { width: w, height: h });
    svg("bg", SETTINGS.background, W, H);
    SETTINGS.players.forEach((p, i) => this.load.image("player" + i, p.image));
    this.load.image("slime", "../../assets/sprites/slime.svg");
  }

  create() {
    this.add.image(0, 0, "bg").setOrigin(0, 0);
    this.players = SETTINGS.players.map((p, i) => {
      const sprite = this.add.image(500 + i * 600, 600, "player" + i).setDepth(5);
      sprite.setScale(SETTINGS.playerSize / sprite.height);
      return { ...p, sprite, vx: 0, vy: 0 };
    });

    this.enemies = [];
    for (let i = 0; i < SETTINGS.enemies; i++) this.addEnemy();

    this.roundLeft = SETTINGS.roundSeconds;
    this.timerText = this.add.text(W - 140, 70, "", {
      fontFamily: FONT, fontSize: "48px", fontStyle: "800", color: "#9cc2ff",
    }).setOrigin(1, 0).setDepth(10);
  }

  addEnemy() {
    const slime = this.add.image(Phaser.Math.Between(200, W - 200), Phaser.Math.Between(200, H - 200), "slime").setDepth(4);
    slime.speed = SETTINGS.enemySpeed;
    this.enemies.push(slime);
  }

  update(_time, deltaMs) {
    const dt = deltaMs / 1000;

    this.roundLeft -= dt;
    this.timerText.setText(Math.ceil(Math.max(0, this.roundLeft)) + "s");

    if (this.roundLeft <= 0) this.roundLeft = SETTINGS.roundSeconds; // Restart round

    for (const p of this.players) {
      if (PLAYER && p === this.players[0]) {
        this.control(p, dt); // Player control
      } else {
        this.steer(p, dt); // AI control
      }
    }

    for (const e of this.enemies) {
      e.x += Phaser.Math.FloatBetween(-e.speed, e.speed) * dt;
      e.y += Phaser.Math.FloatBetween(-e.speed, e.speed) * dt;
      e.x = Phaser.Math.Clamp(e.x, 0, W);
      e.y = Phaser.Math.Clamp(e.y, 0, H);
    }
  }

  control(p, dt) {
    const cursorKeys = this.input.keyboard.createCursorKeys();
    p.vx = 0; p.vy = 0;
    if (cursorKeys.left.isDown) p.vx = -p.speed;
    if (cursorKeys.right.isDown) p.vx = p.speed;
    if (cursorKeys.up.isDown) p.vy = -p.speed;
    if (cursorKeys.down.isDown) p.vy = p.speed;

    p.sprite.x += p.vx * dt;
    p.sprite.y += p.vy * dt;
    p.sprite.x = Phaser.Math.Clamp(p.sprite.x, 0, W);
    p.sprite.y = Phaser.Math.Clamp(p.sprite.y, 0, H);
  }

  steer(p, dt) {
    // Simple AI to steer towards a random direction
    const direction = Phaser.Math.FloatBetween(0, Math.PI * 2);
    p.sprite.x += Math.cos(direction) * p.speed * dt;
    p.sprite.y += Math.sin(direction) * p.speed * dt;
  }
}

// Game initialization
new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: "#0b1530",
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Play,
});
</script>
