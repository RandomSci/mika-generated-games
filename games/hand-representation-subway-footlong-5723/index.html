<script>
// Settings
const SETTINGS = {
  title: "Subway Footlong",
  subtitle: "Give our hand a Subway footlong",
  particlesCount: 40,
  effects: ["sparkles", "bokeh"],
  amount: 1,
  drift: 1,
};

// Setup the canvas and context
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
function fit() { 
  fx.width = innerWidth * devicePixelRatio; 
  fx.height = innerHeight * devicePixelRatio; 
  ctx.scale(devicePixelRatio, devicePixelRatio); // Scale the context for high DPI displays
}
addEventListener("resize", fit); fit();

// Particle generation
const particles = [];
const KINDS = {
  sparkles: { n: 40, make: () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 5 + 5, life: Math.random() * 2 + 1 }) },
  bokeh: { n: 30, make: () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 30 + 20, life: Math.random() * 5 + 2 }) },
};
function spawn(kind) {
  const p = KINDS[kind].make();
  p.kind = kind; p.age = 0; p.color = '#ffb55e'; // Set to warm color
  particles.push(p);
}
SETTINGS.effects.forEach((kind) => {
  for (let i = 0; i < KINDS[kind].n * SETTINGS.amount; i++) { spawn(kind); }
});

// Drawing particles
function drawParticle(p, W, H) {
  const x = p.x * W, y = p.y * H, fade = 1 - (p.age / p.life);
  ctx.fillStyle = p.color; ctx.globalAlpha = fade;
  ctx.beginPath(); ctx.arc(x, y, p.r, 0, Math.PI * 2); ctx.fill();
}

// Animation loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  
  ctx.clearRect(0, 0, fx.width, fx.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt;
    if (p.age > p.life) particles.splice(i, 1); // Remove dead particles
    else drawParticle(p, fx.width, fx.height);
  }
  
  // Make sure to spawn to keep the effect alive
  if (particles.length < SETTINGS.particlesCount) {
    spawn("sparkles");
  }
  
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
