<!doctype html>
<html>
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta charset="utf-8">
<title>Snake Patrol</title>
<style>
  :root {
    --night: #0f1d3a;
    --dusk: #2a4a86;
    --glass: #9cc2ff;
    --lamp: #ffb55e;
    --paint: #ff6f9c;
    --mint: #5fe3c8;
    --paper: #f4ead8;
  }
  html, body { 
    margin: 0; 
    height: 100%; 
    overflow: hidden; 
    background: linear-gradient(var(--night), #1b2f5c); 
    font-family: "Nunito", "Quicksand", "Avenir Next", "Segoe UI", system-ui, sans-serif; 
  }
</style>
<script src="../../libs/phaser/3.90.0/phaser.min.js"></script>
</head>
<body>
<script>
// ===== SETTINGS: change these first =====
const SETTINGS = {
  title: "Snake Patrol",
  player: "../../assets/sprites/ship.svg",
  playerHeight: 120,
  enemies: [
    { key: "rock1", url: "../../assets/sprites/asteroid-1.svg", size: 110, hp: 2, points: 10 },
    { key: "rock2", url: "../../assets/sprites/asteroid-2.svg", size: 90, hp: 1, points: 10 },
    { key: "ufo", url: "../../assets/sprites/ufo.svg", size: 130, hp: 3, points: 30 },
  ],
  lives: 3,
  fireEvery: 0.16,
  spawnEvery: 0.75,
  skill: 0.9,
};

class Play extends Phaser.Scene {
  constructor() { super("play"); }

  preload() {
    const svg = (key, url, w, h) => this.load.svg(key, url, { width: w, height: h });
    svg("space", "../../assets/backgrounds/space-nebula.svg", 1920, 1080);
    svg("laser", "../../assets/sprites/laser.svg", 20, 44);
    svg("heart", "../../assets/sprites/heart.svg", 56, 54);
    svg("coin", "../../assets/sprites/star-coin.svg", 64, 64);
    svg("glow", "../../assets/particles/glow.svg", 64, 64);
    svg("spark", "../../assets/particles/spark.svg", 32, 32);
    for (const e of SETTINGS.enemies) svg(e.key, e.url, e.size, e.size);
    if (SETTINGS.player.endsWith(".svg")) svg("player", SETTINGS.player, 120, 132);
    else this.load.image("player", SETTINGS.player);
  }

  create() {
    this.bg = [0, -1080].map((y) => this.add.image(0, y, "space").setOrigin(0, 0));
    this.add.particles(0, 0, "glow", {
      x: { min: 0, max: 1920 }, y: -20, speedY: { min: 300, max: 900 },
      scale: { min: 0.04, max: 0.12 }, alpha: { min: 0.4, max: 1 }, lifespan: 2500,
      frequency: 40, blendMode: "ADD",
    });

    this.player = this.add.image(960, 900, "player").setDepth(5);
    this.player.setScale(SETTINGS.playerHeight / this.player.height);
    this.add.particles(0, 0, "glow", {
      follow: this.player, followOffset: { y: 60 }, speedY: { min: 200, max: 400 },
      scale: { start: 0.5, end: 0 }, alpha: { start: 0.8, end: 0 }, lifespan: 300,
      tint: [0xffb55e, 0xff6f9c], blendMode: "ADD", frequency: 20,
    }).setDepth(4);
    this.explosion = this.add.particles(0, 0, "spark", {
      speed: { min: 120, max: 620 }, lifespan: 800, scale: { start: 1.3, end: 0 },
      tint: [0xffb55e, 0xff6f9c, 0x9cc2ff, 0xffffff], blendMode: "ADD", emitting: false,
    }).setDepth(8);

    this.snake = [{ x: 960, y: 900 }];
    this.score = 0; this.lives = SETTINGS.lives; this.wave = 1; 
    this.spawnTimer = 1.2; this.targetX = 960; this.addCoin();

    const font = "Nunito, Quicksand, 'Segoe UI', system-ui, sans-serif";
    this.scoreText = this.add.text(60, 40, "0", {
      fontFamily: font, fontSize: "72px", fontStyle: "900", color: "#f4ead8",
    }).setShadow(0, 0, "#ffb55e", 20, true, true).setDepth(10);
    
    this.hearts = []; this.drawLives();
    
    const title = this.add.text(960, 440, SETTINGS.title, {
      fontFamily: font, fontSize: "130px", fontStyle: "900", color: "#ffb55e",
    }).setOrigin(0.5).setShadow(0, 0, "#ff6f9c", 30, true, true).setDepth(10);
    
    this.tweens.add({ targets: title, alpha: 0, y: 380, delay: 1600, duration: 900 });
  }

  addCoin() {
    const coin = this.add.image(Phaser.Math.Between(100, 1820), Phaser.Math.Between(100, 800), "coin").setDepth(4);
    this.coin = coin;
  }

  drawLives() {
    this.hearts.forEach((h) => h.destroy());
    this.hearts = [];
    for (let i = 0; i < this.lives; i++) {
      this.hearts.push(this.add.image(80 + i * 64, 160, "heart").setDepth(10));
    }
  }

  update(_time, deltaMs) {
    const dt = Math.min(deltaMs / 1000, 0.05);
    for (const image of this.bg) {
      image.y += 40 * dt;
      if (image.y >= 1080) image.y -= 2160;
    }

    this.player.x += (this.targetX - this.player.x) * Math.min(1, 6 * dt);
    this.player.angle = (this.targetX - this.player.x) * 0.03;
    
    // Move the snake
    for (let i = this.snake.length - 1; i > 0; i--) {
      this.snake[i] = { ...this.snake[i - 1] };
    }

    this.snake[0].y -= 200 * dt; // Move snake up
    
    // Check for coin collection
    if (Phaser.Math.Distance.Between(this.snake[0].x, this.snake[0].y, this.coin.x, this.coin.y) < 40) {
      this.score += 25;
      this.scoreText.setText(String(this.score));
      this.explosion.emitParticleAt(this.coin.x, this.coin.y, 12);
      this.coin.destroy();
      this.addCoin();
      
      // Grow the snake
      this.snake.push({ ...this.snake[this.snake.length - 1] });
    }

    // Draw snake segments with growing body effect
    this.snake.forEach((segment, index) => {
      const snakePart = this.add.image(segment.x, segment.y, "player").setDepth(5);
      snakePart.setScale(SETTINGS.playerHeight / snakePart.height);
      if (index > 0) {
        snakePart.setAlpha(1 - (index / this.snake.length));
      }
    });
    
    if (this.snake[0].y < 0) { // Reset game over condition if the snake goes off the top
      this.score = 0; 
      this.drawLives(); 
      this.snake = [{ x: 960, y: 900 }];
    }
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: 1920,
  height: 1080,
  backgroundColor: "#0f1d3a",
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: Play,
});
</script>
</body>
</html>
