<script>
// ===== SETTINGS: change these first =====
const SETTINGS = {
  title: "FRCFinance Chess",
  playerColor: 0xffb55e,
  enemyColor: 0xff6f9c,
  boardSize: 8, // 8x8 chessboard
  squareSize: 70, // Reduced size for fitting on screen
};

// The Stage plays the game by itself; the published page is played by a person.
const PLAYER = window.GAME_MODE === "player";

const W = 560, H = 560; // Adjusted height for fitting in viewport

class Play extends Phaser.Scene {
  constructor() { super("play"); }

  preload() {
    this.load.image("whitePiece", "../../assets/characters/mika-head.png");
    this.load.image("blackPiece", "../../assets/characters/luna-head.png");
  }

  create() {
    this.createBoard();
    this.createPieces();
    this.selectedPiece = null;
    this.input.on('pointerdown', (pointer) => this.onClick(pointer));
    this.tweens.add({
      targets: this.pieces,
      y: "+=5", // Slight upward movement for animation
      duration: 500,
      yoyo: true,
      repeat: -1,
      ease: "Sine.easeInOut"
    });
  }

  createBoard() {
    this.board = this.add.graphics();
    this.board.lineStyle(1, 0xffffff, 1); // Thinner lines
    for (let i = 0; i < SETTINGS.boardSize; i++) {
      for (let j = 0; j < SETTINGS.boardSize; j++) {
        if ((i + j) % 2 === 0) {
          this.board.fillStyle(0xeeeeee, 1);
        } else {
          this.board.fillStyle(0xaaaaaa, 1);
        }
        this.board.fillRect(i * SETTINGS.squareSize, j * SETTINGS.squareSize, SETTINGS.squareSize, SETTINGS.squareSize);
      }
    }
  }

  createPieces() {
    this.pieces = [];
    for (let i = 0; i < SETTINGS.boardSize; i++) {
      this.addPiece(i, 0, "whitePiece");
      this.addPiece(i, 7, "blackPiece");
    }
  }

  addPiece(x, y, key) {
    const piece = this.add.image(x * SETTINGS.squareSize + SETTINGS.squareSize / 2, y * SETTINGS.squareSize + SETTINGS.squareSize / 2, key);
    piece.setInteractive();
    piece.setOrigin(0.5, 0.5);
    piece.on('pointerdown', () => this.onPieceClick(piece));
    this.pieces.push(piece);
  }

  onPieceClick(piece) {
    if (PLAYER) {
      if (this.selectedPiece) {
        this.movePiece(piece); // Move selected piece to this position
        this.selectedPiece.setTint(0xffffff); // Reset tint
        this.selectedPiece = null;
      } else {
        this.selectedPiece = piece;
        piece.setTint(0xffbbbb); // Highlight selected piece
      }
    }
  }

  movePiece(targetPiece) {
    if (this.selectedPiece !== targetPiece) {
      this.tweens.add({
        targets: this.selectedPiece,
        x: targetPiece.x,
        y: targetPiece.y,
        duration: 300,
        ease: 'Power1',
      });
    }
  }

  onClick(pointer) {
    if (!this.selectedPiece) {
      this.input.once('pointerup', () => {
        if (this.selectedPiece) {
          this.selectedPiece.setTint(0xffffff); // Reset tint
          this.selectedPiece = null;
        }
      });
    }
  }
  
  update() {
    // AI or other updates can go here if needed
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  width: W,
  height: H,
  backgroundColor: "#0b1530",
  scene: Play,
});
</script>
